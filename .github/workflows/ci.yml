name: SOTA 2026 Continuous Integration Pipeline

on:
  push:
    branches: [ master, main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-hygiene:
    name: Code Hygiene (Spotless & PMD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Spotless and PMD Checks
        run: ./gradlew check -x test

  unit-tests:
    name: Unit & Property-Based Tests (jqwik)
    runs-on: ubuntu-latest
    needs: code-hygiene
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew runAllUnitTests

  integration-tests:
    name: Integration Tests (Testcontainers 2.0.5)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Testcontainers Suite
        run: ./gradlew runAllIntegrationTests

      - name: Generate and Verify Coverage Gate
        run: ./gradlew generateCoverageReport jacocoTestCoverageVerification

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: '**/build/reports/jacoco/**'
          retention-days: 14

  docker-packaging:
    name: Multi-Stage Docker Packaging
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Executable Boot Jars
        run: ./gradlew bootJar -x test

      - name: Build ingestion-service Docker Image
        run: docker build -f ingestion-service/Dockerfile -t ingestion-service:latest .

      - name: Build core-platform-service Docker Image
        run: docker build -f core-platform-service/Dockerfile -t core-platform-service:latest .
